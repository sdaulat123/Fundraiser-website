backend:
  name: git-gateway
  branch: main

media_folder: public/uploads/blog
public_folder: /uploads/blog
site_url: /
display_url: /
logo_url: /favicon.svg

collections:
  - name: posts
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} - {{publishedAt}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "URL slug, for example my-new-post" }
      - { label: Category, name: category, widget: string, default: General }
      - { label: Publish Date, name: publishedAt, widget: datetime }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Cover Image, name: coverImage, widget: image, required: false }
      - { label: Cover Image Alt, name: coverImageAlt, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
